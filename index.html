
<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#f5f7fb">
    <title>联系卖家 · 微信咨询</title>
    <style>
        :root {
            font-family: system-ui,-apple-system,"Microsoft YaHei",sans-serif;
            color: #1f2937;
            background: #f5f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 22px;
        }

        .card {
            width: min(100%,420px);
            background: #fff;
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 14px 45px #18233b12;
            text-align: center;
        }

        .avatar {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: #e8f8ef;
            color: #12a150;
            border-radius: 20px;
            display: grid;
            place-items: center;
            font-size: 32px;
        }

        h1 {
            font-size: 23px;
            margin: 0 0 9px;
        }

        .sub {
            font-size: 14px;
            color: #6b7280;
            margin: 0 0 24px;
            line-height: 1.7;
        }

        .qr {
            width: min(100%,230px);
            aspect-ratio: 1;
            object-fit: contain;
            border: 1px solid #edf0f4;
            border-radius: 15px;
            padding: 10px;
            background: white;
        }

        .hint {
            font-size: 13px;
            color: #6b7280;
            margin: 15px 0 22px;
            line-height: 1.7;
        }

        .btn {
            display: block;
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            margin-top: 10px;
        }

        .primary {
            background: #15b85c;
            color: white;
        }

        .disabled {
            opacity: .45;
            pointer-events: none;
        }

        .foot {
            color: #9ca3af;
            font-size: 12px;
            line-height: 1.7;
            margin: 23px 0 0;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="avatar" aria-hidden="true">微</div>

        <h1>联系卖家</h1>

        <p class="sub">
            感谢您的支持！<br>
            如需商品使用交流或咨询，可通过微信联系。
        </p>

        <img class="qr"
             id="qr"
             src="wechat-qr.png"
             alt="卖家微信二维码">

        <p class="hint">
            长按二维码保存图片<br>
            打开微信扫一扫，选择相册识别添加
        </p>

        <a class="btn primary"
           id="save"
           href="wechat-qr.png"
           download="wechat-qr.png">
            保存微信二维码
        </a>

        <p class="foot">
            平台订单、付款、退款及售后保障<br>
            请继续通过原交易平台处理。<br>
            添加微信为自愿选择。
        </p>
    </main>

    <script>
        const img = document.getElementById('qr');
        const save = document.getElementById('save');

        img.onerror = () => {
            img.alt = '微信二维码加载失败，请稍后重试';
            save.classList.add('disabled');
        };
    </script>
</body>
</html>
